services:
  mysql:
    image: mysql:8.4
    container_name: eficaz-b2b-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eficaz_b2b
      MYSQL_USER: eficaz
      MYSQL_PASSWORD: eficaz
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
